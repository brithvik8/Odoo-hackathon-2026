<!DOCTYPE html>
<html>

<head>

<title>TransitOps Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(135deg,#020617,#0f172a,#1e3a8a);

}


/* Main Card */

.login-container{

    width:420px;

    background:rgba(255,255,255,0.1);

    backdrop-filter:blur(20px);

    padding:35px;

    border-radius:25px;

    color:white;

    box-shadow:
    0 25px 50px rgba(0,0,0,0.5);

}



/* Logo */


.logo{

    text-align:center;

    margin-bottom:25px;

}


.logo h1{

    font-size:36px;

    color:#38bdf8;

}


.logo p{

    color:#cbd5e1;

    margin-top:8px;

}



/* Inputs */


label{

    display:block;

    margin-top:18px;

    font-size:14px;

    color:#e2e8f0;

}



.input-box{

    position:relative;

}


input,select{

    width:100%;

    padding:13px;

    margin-top:7px;

    border-radius:12px;

    border:none;

    outline:none;

    background:#f8fafc;

    font-size:15px;

}



.show{

    position:absolute;

    right:12px;

    top:18px;

    cursor:pointer;

    color:#2563eb;

    font-size:13px;

}



/* Captcha */


.captcha{

    margin-top:10px;

    background:#020617;

    padding:15px;

    text-align:center;

    border-radius:12px;

    font-size:24px;

    letter-spacing:6px;

    color:#22c55e;

    font-weight:bold;

}



/* Button */


button{

    width:100%;

    margin-top:25px;

    padding:14px;

    border:none;

    border-radius:30px;

    background:#2563eb;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}



button:hover{

    background:#1d4ed8;

    transform:scale(1.03);

}



/* Remember */


.remember{

    margin-top:15px;

    display:flex;

    gap:8px;

    align-items:center;

}



/* Message */


.message{

    text-align:center;

    margin-top:15px;

    font-weight:bold;

}



/* Demo */

.demo{

    margin-top:25px;

    padding:15px;

    background:rgba(255,255,255,0.1);

    border-radius:15px;

    font-size:13px;

}


</style>


</head>



<body>



<div class="login-container">


<div class="logo">

<h1>🚍 TransitOps</h1>

<p>
Smart Transport Operations Platform
</p>

</div>



<div id="loginForm">
<label>Email Address</label>

<input id="email"
placeholder="Enter email">



<label>Password</label>


<div class="input-box">

<input id="password"
type="password"
placeholder="Enter password">


<span class="show"
onclick="showPassword()">

Show

</span>


</div>





<label>Login Role</label>


<select id="role">


<option>
Fleet Manager
</option>


<option>
Dispatcher
</option>


<option>
Safety Officer
</option>


<option>
Financial Analyst
</option>


</select>





<label>Security Verification</label>


<div class="captcha" id="captcha">

</div>


<input id="captchaInput"
placeholder="Enter answer">





<div class="remember">

<input type="checkbox">

<span>
Remember me
</span>

</div>





<button type="button" onclick="login()">LOGIN</button>
</div>

<div id="registerForm" style="display:none;">
<label>Register Email Address</label>

<input id="registerEmail"
placeholder="Enter email">



<label>Register Password</label>


<div class="input-box">

<input id="registerPassword"
type="password"
placeholder="Enter password">

</div>


<label>Register Role</label>


<select id="registerRole">


<option>
Fleet Manager
</option>


<option>
Dispatcher
</option>


<option>
Safety Officer
</option>


<option>
Financial Analyst
</option>


</select>


<button type="button" onclick="register()">REGISTER</button>
</div>

<div id="toggleText" style="text-align:center; margin-top:15px; font-size:13px; color:#cbd5e1;">
    Don't have an account? <span style="color:#38bdf8; cursor:pointer; text-decoration:underline;" onclick="toggleForm('register')">Register</span>
</div>



<div class="message"
id="message">

</div>





<div class="demo">

<b>Demo Login:</b>

<br><br>

Manager:
manager@transitops.com

<br>

Password:
12345

<br><br>

Dispatcher:
dispatcher@transitops.com

<br>

Password:
12345


</div>



</div>







<script>


let x,y;



function generateCaptcha(){


x=Math.floor(Math.random()*9)+1;

y=Math.floor(Math.random()*9)+1;


document.getElementById("captcha")
.innerHTML=
x+" + "+y+" = ?";


}


generateCaptcha();






function showPassword(){


let pass=document.getElementById("password");


if(pass.type==="password"){

pass.type="text";

}

else{

pass.type="password";

}


}



// Database Initialisation
const DEFAULT_USERS = [
    { email: "manager@transitops.com", password: "12345", role: "Fleet Manager" },
    { email: "dispatcher@transitops.com", password: "12345", role: "Dispatcher" }
];

function initDatabase() {
    if (!localStorage.getItem("users")) {
        localStorage.setItem("users", JSON.stringify(DEFAULT_USERS));
    }
}
initDatabase();



function toggleForm(formType) {
    let loginForm = document.getElementById("loginForm");
    let registerForm = document.getElementById("registerForm");
    let toggleText = document.getElementById("toggleText");
    let subtitle = document.querySelector(".logo p");
    let msg = document.getElementById("message");

    msg.innerHTML = "";

    if (formType === "register") {
        loginForm.style.display = "none";
        registerForm.style.display = "block";
        subtitle.innerHTML = "Create your TransitOps Account";
        toggleText.innerHTML = `Already have an account? <span style="color: #38bdf8; cursor: pointer; text-decoration: underline;" onclick="toggleForm('login')">Login</span>`;
    } else {
        loginForm.style.display = "block";
        registerForm.style.display = "none";
        subtitle.innerHTML = "Smart Transport Operations Platform";
        toggleText.innerHTML = `Don't have an account? <span style="color: #38bdf8; cursor: pointer; text-decoration: underline;" onclick="toggleForm('register')">Register</span>`;
        generateCaptcha();
    }
}



function login(){


let email=
document.getElementById("email").value.trim();


let password=
document.getElementById("password").value;


let captcha=
document.getElementById("captchaInput").value.trim();



let role=
document.getElementById("role").value;





if(email==""||password==""){


display(
"Please enter login details ❌",
"red"
);

return;


}



if(Number(captcha)!=(x+y)){


display(
"Wrong CAPTCHA ❌",
"red"
);


generateCaptcha();

return;


}



// Database Check
let users = JSON.parse(localStorage.getItem("users")) || DEFAULT_USERS;
let matchedUser = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password && u.role === role);

if(matchedUser){



localStorage.setItem(
"user",
matchedUser.email
);


localStorage.setItem(
"role",
matchedUser.role
);



display(
"Login Successful ✅",
"#22c55e"
);



setTimeout(()=>{

alert(
"Welcome "+matchedUser.role+
"\nOpening Dashboard..."
);
window.location.href = "dashboard.html";


},1000);



}

else{


display(
"Invalid Credentials ❌",
"red"
);


}



}



function register() {
    let email = document.getElementById("registerEmail").value.trim();
    let password = document.getElementById("registerPassword").value;
    let role = document.getElementById("registerRole").value;

    if (email === "" || password === "") {
        display("Please fill in all details ❌", "red");
        return;
    }

    if (!email.includes("@") || !email.includes(".")) {
        display("Please enter a valid email address ❌", "red");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || DEFAULT_USERS;

    if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
        display("Email already registered ❌", "red");
        return;
    }

    users.push({ email, password, role });
    localStorage.setItem("users", JSON.stringify(users));

    display("Registration Successful! Please Login ✅", "#22c55e");

    document.getElementById("registerEmail").value = "";
    document.getElementById("registerPassword").value = "";

    setTimeout(() => {
        toggleForm('login');
    }, 1500);
}



function display(text,color){

let msg=
document.getElementById("message");


msg.innerHTML=text;

msg.style.color=color;


}


</script>



</body>

</html>
